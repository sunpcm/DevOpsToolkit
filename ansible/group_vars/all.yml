---
# Required by wsl-bootstrap and ubuntu-bootstrap. user-only defaults to the
# authenticated account and rejects a different value.
target_user: ""
target_password_hash: ""
target_authorized_keys: []
target_passwordless_sudo: false

# User profile
configure_shell: true
install_oh_my_zsh: "{{ configure_shell }}"
configure_git: true
configure_uv: true
configure_node: true
configure_go: true
goenv_allow_default_tools: false
configure_homebrew_environment: true
configure_wsl_integration: true
enable_wsl_docker_integration: true

git_user_name: ""
git_user_email: ""
git_editor: nvim
git_default_branch: main
git_pull_rebase: "false"

nvm_version: bab86d5de571015b63fd8fc30b47bbe072a1290e
node_version: "24.11.1"
go_version: "1.27.1"
uv_version: "0.9.18"
uv_artifacts:
  x86_64:
    archive: uv-x86_64-unknown-linux-gnu.tar.gz
    sha256: c2def3db178ade63933fa15ffc96e882c196ce53e06173dcee05b36c5f6f68f5
  aarch64:
    archive: uv-aarch64-unknown-linux-gnu.tar.gz
    sha256: f8e23ec786b18660ade6b033b6191b7e9c283c872eeb8c4531d56a873decf160
uv_release_base_url_default: "https://github.com/astral-sh/uv/releases/download/{{ uv_version }}"
uv_release_base_url: >-
  {{ lookup('ansible.builtin.env', 'DEVOPS_TOOLKIT_UV_RELEASE_BASE_URL')
     | default(uv_release_base_url_default, true) }}
goenv_version: "3.1.4"
goenv_source_commit: 66571a3851c83e1341dce284aba907964c3d6a48
goenv_artifacts:
  x86_64:
    archive: goenv_3.1.4_linux_amd64.tar.gz
    sha256: 6fe050330f1fc14b3cdd84467a76e93245817bb9526629f1ae0e25d0c6d3baab
    binary_sha256: 5a37b77bc5ba4f8cdb973b46b270f4d69c9ed381aeace7f3a967a461f7ec2f79
  aarch64:
    archive: goenv_3.1.4_linux_arm64.tar.gz
    sha256: 990847f599b36a8bf6f933cbc6fe475220813db0d805741e2a9a785ab1ecd162
    binary_sha256: a25cb3515c70c71a0be23539522a7d96009d332a558d82f008f3313eb966b81a
goenv_release_base_url_default: "https://github.com/go-nv/goenv/releases/download/{{ goenv_version }}"
goenv_release_base_url: >-
  {{ lookup('ansible.builtin.env', 'DEVOPS_TOOLKIT_GOENV_RELEASE_BASE_URL')
     | default(goenv_release_base_url_default, true) }}

# Docker's Ubuntu APT signing key, fetched from the official URL below.
# Update this digest deliberately when Docker rotates the key.
docker_apt_gpg_sha256: "1500c1f56fa9e26b9b8f42452a553675796ade0807cdce11975eb98170b3a570"

# Immutable revisions keep repeated runs reproducible. Update them deliberately.
ohmyzsh_version: c954bbb168fc645592c50017de0d0e138db8df5f
zsh_theme: robbyrussell   # agnoster
zsh_plugins:
  - git
  - zsh-autosuggestions
  - zsh-syntax-highlighting
zsh_plugin_sources:
  zsh-autosuggestions:
    repo: https://github.com/zsh-users/zsh-autosuggestions
    version: 0e810e5afa27acbd074398eefbe28d13005dbc15
  zsh-syntax-highlighting:
    repo: https://github.com/zsh-users/zsh-syntax-highlighting
    version: 5eb677bb0fa9a3e60f0eff031dc13926e093df92

# System profile
system_timezone: Asia/Shanghai
system_locale: en_US.UTF-8
apt_cache_valid_time: 3600
system_packages:
  - build-essential
  - ca-certificates
  - curl
  - git
  - iproute2
  - locales
  - sudo
  - unzip
  - zsh

install_linuxbrew: true
linuxbrew_version: 686144996e76cda071d5829d1c180704dd271fc3
linuxbrew_packages:
  - bat
  - btop
  - dust
  - eza
  - fd
  - fzf
  - gh
  - git
  - goenv
  - httpie
  - jq
  - lazydocker
  - lazygit
  - neovim
  - procs
  - ripgrep
  - starship
  - tldr
  - yq

install_docker: false
install_nginx: false
enable_firewall: true
firewall_managed_profile_name: DevOpsToolkit
firewall_ssh_finalize_guard_name: DevOpsToolkitSSHFinalizeGuard
firewall_allowed_ports:
  - { port: "{{ ssh_port }}", proto: tcp }
firewall_effective_allowed_ports: "{{ firewall_allowed_ports }}"

# SSH changes are deliberately conservative by default.
configure_ssh: true
ssh_port: 22
disable_root_login: false
disable_password_auth: false
ssh_finalize_key_verified: false

# user-only is strict unless this explicit exception is enabled.
user_only_allow_system_dependencies: false
