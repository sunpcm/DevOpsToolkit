---
- name: Validate user-profile identity and path
  ansible.builtin.assert:
    that:
      - profile_target_user | length > 0
      - profile_target_user != 'root'
      - profile_target_home.startswith('/')
      - profile_target_home != '/'
      - profile_target_home != '/root'
    fail_msg: "Unsafe user profile target: {{ profile_target_user }} {{ profile_target_home }}"

- name: Read the canonical profile account
  ansible.builtin.getent:
    database: passwd
    key: "{{ profile_target_user }}"

- name: Ensure supplied HOME matches the account database
  ansible.builtin.assert:
    that:
      - ansible_facts['getent_passwd'][profile_target_user][4] == profile_target_home
    fail_msg: "Profile HOME does not match passwd database; refusing to write."

- name: Validate user-profile component combinations
  ansible.builtin.assert:
    that:
      - not (install_oh_my_zsh | bool) or (configure_shell | bool)
    fail_msg: >-
      install_oh_my_zsh=true requires configure_shell=true. Language runtimes
      and Linuxbrew environment loading do not require either option.

- name: Resolve whether portable tool environment loading is required
  ansible.builtin.set_fact:
    profile_environment_enabled: >-
      {{
        (configure_uv | bool)
        or (configure_node | bool)
        or (configure_go | bool)
        or (configure_homebrew_environment | bool)
      }}

- name: Create managed user configuration directory
  become: "{{ profile_use_become }}"
  become_user: "{{ profile_target_user }}"
  ansible.builtin.file:
    path: "{{ profile_target_home }}/.config/devops-toolkit"
    state: directory
    mode: "0700"

- name: Inspect the shared Linuxbrew executable
  ansible.builtin.stat:
    path: /home/linuxbrew/.linuxbrew/bin/brew
  register: profile_shared_brew
  when: configure_homebrew_environment | bool

- name: Explain a requested but unavailable shared Linuxbrew environment
  ansible.builtin.debug:
    msg: >-
      configure_homebrew_environment=true, but the shared brew executable is
      absent. Keeping the guarded loader so a later system-level Linuxbrew
      install becomes available without rewriting user files.
  when:
    - configure_homebrew_environment | bool
    - not profile_shared_brew.stat.exists

- name: Install the portable tool environment configuration
  become: "{{ profile_use_become }}"
  become_user: "{{ profile_target_user }}"
  ansible.builtin.template:
    src: environment.sh.j2
    dest: "{{ profile_target_home }}/.config/devops-toolkit/environment.sh"
    mode: "0600"
  when: profile_environment_enabled | bool

- name: Remove the portable environment file when no tool environment is enabled
  become: "{{ profile_use_become }}"
  become_user: "{{ profile_target_user }}"
  ansible.builtin.file:
    path: "{{ profile_target_home }}/.config/devops-toolkit/environment.sh"
    state: absent
  when: not (profile_environment_enabled | bool)

- name: Install managed base Zsh configuration
  become: "{{ profile_use_become }}"
  become_user: "{{ profile_target_user }}"
  ansible.builtin.template:
    src: shell.zsh.j2
    dest: "{{ profile_target_home }}/.config/devops-toolkit/shell.zsh"
    mode: "0600"
  when: configure_shell | bool

- name: Check whether the target Zsh configuration exists
  become: "{{ profile_use_become }}"
  become_user: "{{ profile_target_user }}"
  ansible.builtin.stat:
    path: "{{ profile_target_home }}/.zshrc"
  register: target_zshrc

- name: Check whether the target login profile exists
  become: "{{ profile_use_become }}"
  become_user: "{{ profile_target_user }}"
  ansible.builtin.stat:
    path: "{{ profile_target_home }}/.profile"
  register: target_login_profile

- name: Remove the legacy combined Zsh loader before splitting components
  become: "{{ profile_use_become }}"
  become_user: "{{ profile_target_user }}"
  ansible.builtin.blockinfile:
    path: "{{ profile_target_home }}/.zshrc"
    marker: "# {mark} DEVOPSTOOLKIT USER PROFILE"
    state: absent
  when: target_zshrc.stat.exists

- name: Ensure the target Zsh configuration exists
  become: "{{ profile_use_become }}"
  become_user: "{{ profile_target_user }}"
  ansible.builtin.file:
    path: "{{ profile_target_home }}/.zshrc"
    state: touch
    mode: "0644"
    modification_time: preserve
    access_time: preserve
  when:
    - (configure_shell | bool) or (profile_environment_enabled | bool)
    - not target_zshrc.stat.exists

- name: Load the portable environment from Zsh without replacing user content
  become: "{{ profile_use_become }}"
  become_user: "{{ profile_target_user }}"
  ansible.builtin.blockinfile:
    path: "{{ profile_target_home }}/.zshrc"
    marker: "# {mark} DEVOPSTOOLKIT USER ENVIRONMENT"
    block: |
      [ -r "$HOME/.config/devops-toolkit/environment.sh" ] && source "$HOME/.config/devops-toolkit/environment.sh"
    backup: true
  when: profile_environment_enabled | bool

- name: Load the portable environment from login shells
  become: "{{ profile_use_become }}"
  become_user: "{{ profile_target_user }}"
  ansible.builtin.blockinfile:
    path: "{{ profile_target_home }}/.profile"
    marker: "# {mark} DEVOPSTOOLKIT USER ENVIRONMENT"
    block: |
      [ -r "$HOME/.config/devops-toolkit/environment.sh" ] && . "$HOME/.config/devops-toolkit/environment.sh"
    create: true
    mode: "0644"
    backup: true
  when: profile_environment_enabled | bool

- name: Load the managed base Zsh file without replacing user content
  become: "{{ profile_use_become }}"
  become_user: "{{ profile_target_user }}"
  ansible.builtin.blockinfile:
    path: "{{ profile_target_home }}/.zshrc"
    marker: "# {mark} DEVOPSTOOLKIT USER SHELL"
    block: |
      [ -r "$HOME/.config/devops-toolkit/shell.zsh" ] && source "$HOME/.config/devops-toolkit/shell.zsh"
    backup: true
  when: configure_shell | bool

- name: Remove the managed base Zsh loader when shell management is disabled
  become: "{{ profile_use_become }}"
  become_user: "{{ profile_target_user }}"
  ansible.builtin.blockinfile:
    path: "{{ profile_target_home }}/.zshrc"
    marker: "# {mark} DEVOPSTOOLKIT USER SHELL"
    state: absent
  when:
    - not configure_shell | bool
    - target_zshrc.stat.exists

- name: Remove the Zsh environment loader when no tool environment is enabled
  become: "{{ profile_use_become }}"
  become_user: "{{ profile_target_user }}"
  ansible.builtin.blockinfile:
    path: "{{ profile_target_home }}/.zshrc"
    marker: "# {mark} DEVOPSTOOLKIT USER ENVIRONMENT"
    state: absent
  when:
    - not (profile_environment_enabled | bool)
    - target_zshrc.stat.exists

- name: Remove the login environment loader when no tool environment is enabled
  become: "{{ profile_use_become }}"
  become_user: "{{ profile_target_user }}"
  ansible.builtin.blockinfile:
    path: "{{ profile_target_home }}/.profile"
    marker: "# {mark} DEVOPSTOOLKIT USER ENVIRONMENT"
    state: absent
  when:
    - not (profile_environment_enabled | bool)
    - target_login_profile.stat.exists

- name: Remove the managed shell file when shell management is disabled
  become: "{{ profile_use_become }}"
  become_user: "{{ profile_target_user }}"
  ansible.builtin.file:
    path: "{{ profile_target_home }}/.config/devops-toolkit/shell.zsh"
    state: absent
  when: not configure_shell | bool

- name: Check the installed Oh My Zsh revision
  become: "{{ profile_use_become }}"
  become_user: "{{ profile_target_user }}"
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ profile_target_home }}/.oh-my-zsh"
      - rev-parse
      - HEAD
  register: ohmyzsh_revision
  changed_when: false
  failed_when: false
  when: install_oh_my_zsh | bool

- name: Install Oh My Zsh without executing a remote installer
  become: "{{ profile_use_become }}"
  become_user: "{{ profile_target_user }}"
  ansible.builtin.git:
    repo: https://github.com/ohmyzsh/ohmyzsh.git
    dest: "{{ profile_target_home }}/.oh-my-zsh"
    version: "{{ ohmyzsh_version }}"
    update: true
  when:
    - install_oh_my_zsh | bool
    - ohmyzsh_revision.rc != 0 or (ohmyzsh_revision.stdout | trim) != ohmyzsh_version

- name: Check managed Zsh plugin revisions
  become: "{{ profile_use_become }}"
  become_user: "{{ profile_target_user }}"
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ profile_target_home }}/.oh-my-zsh/custom/plugins/{{ item.key }}"
      - rev-parse
      - HEAD
  loop: "{{ zsh_plugin_sources | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: zsh_plugin_revisions
  changed_when: false
  failed_when: false
  when:
    - install_oh_my_zsh | bool
    - item.key in zsh_plugins

- name: Install managed Zsh plugins
  become: "{{ profile_use_become }}"
  become_user: "{{ profile_target_user }}"
  ansible.builtin.git:
    repo: "{{ item.item.value.repo }}"
    dest: "{{ profile_target_home }}/.oh-my-zsh/custom/plugins/{{ item.item.key }}"
    version: "{{ item.item.value.version }}"
    update: true
  loop: "{{ zsh_plugin_revisions.results | default([]) }}"
  loop_control:
    label: "{{ item.item.key }}"
  when:
    - install_oh_my_zsh | bool
    - not item.skipped | default(false)
    - item.rc != 0 or (item.stdout | trim) != item.item.value.version

- name: Configure Git values owned by DevOpsToolkit
  become: "{{ profile_use_become }}"
  become_user: "{{ profile_target_user }}"
  community.general.git_config:
    scope: global
    name: "{{ item.name }}"
    value: "{{ item.value }}"
  environment:
    HOME: "{{ profile_target_home }}"
  loop:
    - { name: user.name, value: "{{ git_user_name }}" }
    - { name: user.email, value: "{{ git_user_email }}" }
    - { name: core.editor, value: "{{ git_editor }}" }
    - { name: init.defaultBranch, value: "{{ git_default_branch }}" }
    - { name: pull.rebase, value: "{{ git_pull_rebase }}" }
  when:
    - configure_git | bool
    - item.value | string | length > 0

- name: Check the configured uv version
  become: "{{ profile_use_become }}"
  become_user: "{{ profile_target_user }}"
  ansible.builtin.command:
    argv:
      - "{{ profile_target_home }}/.local/bin/uv"
      - --version
  register: user_uv
  changed_when: false
  failed_when: false
  when: configure_uv | bool

- name: Validate the uv release artifact for this architecture
  ansible.builtin.assert:
    that:
      - ansible_facts['architecture'] in uv_artifacts
      - uv_artifacts[ansible_facts['architecture']].archive | length > 0
      - uv_artifacts[ansible_facts['architecture']].sha256 is match('^[0-9a-f]{64}$')
      - uv_release_base_url | string is match('^https://\\S+$')
    fail_msg: >-
      uv {{ uv_version }} needs a pinned, checksummed artifact for
      {{ ansible_facts['architecture'] }} and an HTTPS release base URL.
  when:
    - configure_uv | bool
    - >-
      user_uv.rc != 0 or
      not ((user_uv.stdout | trim) == ('uv ' ~ uv_version) or
           (user_uv.stdout | trim).startswith('uv ' ~ uv_version ~ ' '))

- name: Install the pinned uv release artifact in the target HOME
  when:
    - configure_uv | bool
    - >-
      user_uv.rc != 0 or
      not ((user_uv.stdout | trim) == ('uv ' ~ uv_version) or
           (user_uv.stdout | trim).startswith('uv ' ~ uv_version ~ ' '))
  block:
    - name: Create a temporary uv extraction directory
      become: "{{ profile_use_become }}"
      become_user: "{{ profile_target_user }}"
      ansible.builtin.tempfile:
        state: directory
        prefix: devops-toolkit-uv-
      register: uv_temp_dir

    - name: Download the pinned uv release archive
      become: "{{ profile_use_become }}"
      become_user: "{{ profile_target_user }}"
      ansible.builtin.get_url:
        url: >-
          {{ uv_release_base_url | regex_replace('/+$', '')
             }}/{{ uv_artifacts[ansible_facts['architecture']].archive }}
        dest: "{{ uv_temp_dir.path }}/uv.tar.gz"
        checksum: "sha256:{{ uv_artifacts[ansible_facts['architecture']].sha256 }}"
        mode: "0600"
        timeout: 60
      register: uv_archive_download
      retries: 3
      delay: 5
      until: uv_archive_download is succeeded

    - name: Extract the verified uv release archive
      become: "{{ profile_use_become }}"
      become_user: "{{ profile_target_user }}"
      ansible.builtin.unarchive:
        src: "{{ uv_temp_dir.path }}/uv.tar.gz"
        dest: "{{ uv_temp_dir.path }}"
        remote_src: true

    - name: Ensure the target local binary directory exists
      become: "{{ profile_use_become }}"
      become_user: "{{ profile_target_user }}"
      ansible.builtin.file:
        path: "{{ profile_target_home }}/.local/bin"
        state: directory
        mode: "0755"

    - name: Install verified uv binaries
      become: "{{ profile_use_become }}"
      become_user: "{{ profile_target_user }}"
      ansible.builtin.copy:
        src: >-
          {{ uv_temp_dir.path }}/{{ uv_artifacts[ansible_facts['architecture']].archive
          | regex_replace('[.]tar[.]gz$', '') }}/{{ item }}
        dest: "{{ profile_target_home }}/.local/bin/{{ item }}"
        remote_src: true
        mode: "0755"
      loop:
        - uv
        - uvx
  always:
    - name: Remove the temporary uv extraction directory
      become: "{{ profile_use_become }}"
      become_user: "{{ profile_target_user }}"
      ansible.builtin.file:
        path: "{{ uv_temp_dir.path }}"
        state: absent
      when: uv_temp_dir is defined and uv_temp_dir.path is defined

- name: Check the installed NVM revision
  become: "{{ profile_use_become }}"
  become_user: "{{ profile_target_user }}"
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ profile_target_home }}/.nvm"
      - rev-parse
      - HEAD
  register: nvm_revision
  changed_when: false
  failed_when: false
  when: configure_node | bool

- name: Install the pinned NVM source
  become: "{{ profile_use_become }}"
  become_user: "{{ profile_target_user }}"
  ansible.builtin.git:
    repo: https://github.com/nvm-sh/nvm.git
    dest: "{{ profile_target_home }}/.nvm"
    version: "{{ nvm_version }}"
    update: true
  when:
    - configure_node | bool
    - nvm_revision.rc != 0 or (nvm_revision.stdout | trim) != nvm_version

- name: Check the configured Node runtime
  become: "{{ profile_use_become }}"
  become_user: "{{ profile_target_user }}"
  ansible.builtin.command:
    argv:
      - "{{ profile_target_home }}/.nvm/versions/node/v{{ node_version }}/bin/node"
      - --version
  register: user_node
  changed_when: false
  failed_when: false
  when: configure_node | bool

- name: Check the NVM default alias
  become: "{{ profile_use_become }}"
  become_user: "{{ profile_target_user }}"
  ansible.builtin.shell: >-
    test "$(cat {{ (profile_target_home + '/.nvm/alias/default') | quote }} 2>/dev/null)"
    = {{ node_version | quote }}
  args:
    executable: /bin/sh
  register: user_node_default
  changed_when: false
  failed_when: false
  when: configure_node | bool

- name: Install the configured Node version
  become: "{{ profile_use_become }}"
  become_user: "{{ profile_target_user }}"
  ansible.builtin.shell: |
    export NVM_DIR={{ profile_target_home | quote }}'/.nvm'
    . "$NVM_DIR/nvm.sh"
    nvm install {{ node_version | quote }}
    nvm alias default {{ node_version | quote }}
  args:
    executable: /bin/bash
  environment:
    HOME: "{{ profile_target_home }}"
  when:
    - configure_node | bool
    - >-
      user_node.rc != 0 or
      (user_node.stdout | trim) != ('v' ~ node_version) or
      user_node_default.rc != 0

- name: Create the managed user data directory for goenv
  become: "{{ profile_use_become }}"
  become_user: "{{ profile_target_user }}"
  ansible.builtin.file:
    path: "{{ profile_target_home }}/.local/share/devops-toolkit"
    state: directory
    mode: "0700"
  when: configure_go | bool

- name: Ensure the goenv data root exists without replacing legacy content
  become: "{{ profile_use_become }}"
  become_user: "{{ profile_target_user }}"
  ansible.builtin.file:
    path: "{{ profile_target_home }}/.local/share/devops-toolkit/goenv"
    state: directory
    mode: "0700"
  when: configure_go | bool

- name: Inspect existing goenv default-tools policy
  become: "{{ profile_use_become }}"
  become_user: "{{ profile_target_user }}"
  ansible.builtin.stat:
    path: "{{ profile_target_home }}/.local/share/devops-toolkit/goenv/default-tools.yaml"
  register: goenv_default_tools
  when: configure_go | bool

- name: Read existing goenv default-tools policy without changing it
  become: "{{ profile_use_become }}"
  become_user: "{{ profile_target_user }}"
  ansible.builtin.slurp:
    src: "{{ profile_target_home }}/.local/share/devops-toolkit/goenv/default-tools.yaml"
  register: goenv_existing_default_tools
  when:
    - configure_go | bool
    - goenv_default_tools.stat.exists

- name: Decode existing goenv default-tools policy
  ansible.builtin.set_fact:
    goenv_default_tools_config: >-
      {{ goenv_existing_default_tools.content | b64decode | from_yaml }}
  when:
    - configure_go | bool
    - goenv_default_tools.stat.exists

- name: Reject implicit unpinned goenv tool installation
  ansible.builtin.assert:
    that:
      - goenv_default_tools_config is mapping
      - >-
        not (goenv_default_tools_config.enabled | default(false) | bool)
        or (goenv_allow_default_tools | bool)
    fail_msg: >-
      Existing goenv default-tools.yaml enables additional tools. Disable it,
      or explicitly set goenv_allow_default_tools=true to permit additional
      user-selected (possibly unpinned) downloads during Go installation.
  when:
    - configure_go | bool
    - goenv_default_tools.stat.exists

- name: Disable upstream unpinned default tools for a new goenv HOME
  become: "{{ profile_use_become }}"
  become_user: "{{ profile_target_user }}"
  ansible.builtin.copy:
    content: "enabled: false\n"
    dest: "{{ profile_target_home }}/.local/share/devops-toolkit/goenv/default-tools.yaml"
    force: false
    mode: "0600"
  when:
    - configure_go | bool
    - not goenv_default_tools.stat.exists

- name: Explain preserved custom goenv default-tools policy
  ansible.builtin.debug:
    msg: >-
      Existing goenv default-tools.yaml is preserved. Additional tools are
      permitted only with goenv_allow_default_tools=true.
  when:
    - configure_go | bool
    - goenv_default_tools.stat.exists

- name: Validate the goenv release artifact for this architecture
  ansible.builtin.assert:
    that:
      - ansible_facts['architecture'] in goenv_artifacts
      - goenv_artifacts[ansible_facts['architecture']].archive | length > 0
      - goenv_artifacts[ansible_facts['architecture']].sha256 is match('^[0-9a-f]{64}$')
      - goenv_artifacts[ansible_facts['architecture']].binary_sha256 is match('^[0-9a-f]{64}$')
      - goenv_release_base_url | string is match('^https://\\S+$')
    fail_msg: >-
      goenv {{ goenv_version }} needs a pinned, checksummed artifact for
      {{ ansible_facts['architecture'] }} and an HTTPS release base URL.
  when: configure_go | bool

- name: Check the installed goenv binary checksum before executing it
  become: "{{ profile_use_become }}"
  become_user: "{{ profile_target_user }}"
  ansible.builtin.stat:
    path: "{{ profile_target_home }}/.local/share/devops-toolkit/goenv-bin/goenv"
    checksum_algorithm: sha256
  register: goenv_installed_binary
  when: configure_go | bool

- name: Install the pinned goenv v3 binary in the target HOME
  when:
    - configure_go | bool
    - >-
      not goenv_installed_binary.stat.exists or
      (goenv_installed_binary.stat.checksum | default('')) !=
      goenv_artifacts[ansible_facts['architecture']].binary_sha256
  block:
    - name: Create a temporary goenv extraction directory
      become: "{{ profile_use_become }}"
      become_user: "{{ profile_target_user }}"
      ansible.builtin.tempfile:
        state: directory
        prefix: devops-toolkit-goenv-
      register: goenv_temp_dir

    - name: Download the pinned goenv release archive
      become: "{{ profile_use_become }}"
      become_user: "{{ profile_target_user }}"
      ansible.builtin.get_url:
        url: >-
          {{ goenv_release_base_url | regex_replace('/+$', '')
             }}/{{ goenv_artifacts[ansible_facts['architecture']].archive }}
        dest: "{{ goenv_temp_dir.path }}/goenv.tar.gz"
        checksum: "sha256:{{ goenv_artifacts[ansible_facts['architecture']].sha256 }}"
        mode: "0600"
        timeout: 60
      register: goenv_archive_download
      retries: 3
      delay: 5
      until: goenv_archive_download is succeeded

    - name: Extract the verified goenv release archive
      become: "{{ profile_use_become }}"
      become_user: "{{ profile_target_user }}"
      ansible.builtin.unarchive:
        src: "{{ goenv_temp_dir.path }}/goenv.tar.gz"
        dest: "{{ goenv_temp_dir.path }}"
        remote_src: true

    - name: Ensure the managed goenv binary directory exists
      become: "{{ profile_use_become }}"
      become_user: "{{ profile_target_user }}"
      ansible.builtin.file:
        path: "{{ profile_target_home }}/.local/share/devops-toolkit/goenv-bin"
        state: directory
        mode: "0755"

    - name: Install the verified goenv binary
      become: "{{ profile_use_become }}"
      become_user: "{{ profile_target_user }}"
      ansible.builtin.copy:
        src: "{{ goenv_temp_dir.path }}/goenv"
        dest: "{{ profile_target_home }}/.local/share/devops-toolkit/goenv-bin/goenv"
        remote_src: true
        mode: "0755"
  always:
    - name: Remove the temporary goenv extraction directory
      become: "{{ profile_use_become }}"
      become_user: "{{ profile_target_user }}"
      ansible.builtin.file:
        path: "{{ goenv_temp_dir.path }}"
        state: absent
      when: goenv_temp_dir is defined and goenv_temp_dir.path is defined

- name: Verify the installed goenv binary checksum
  become: "{{ profile_use_become }}"
  become_user: "{{ profile_target_user }}"
  ansible.builtin.stat:
    path: "{{ profile_target_home }}/.local/share/devops-toolkit/goenv-bin/goenv"
    checksum_algorithm: sha256
  register: goenv_verified_binary
  when: configure_go | bool

- name: Refuse to execute an unverified goenv binary
  ansible.builtin.assert:
    that:
      - goenv_verified_binary.stat.exists
      - goenv_verified_binary.stat.isreg
      - >-
        goenv_verified_binary.stat.checksum ==
        goenv_artifacts[ansible_facts['architecture']].binary_sha256
    fail_msg: "Installed goenv binary failed its pinned SHA256 verification."
  when: configure_go | bool

- name: Check the verified goenv binary version
  become: "{{ profile_use_become }}"
  become_user: "{{ profile_target_user }}"
  ansible.builtin.command:
    argv:
      - "{{ profile_target_home }}/.local/share/devops-toolkit/goenv-bin/goenv"
      - --version
  register: user_goenv
  changed_when: false
  when: configure_go | bool

- name: Refuse a goenv release artifact with the wrong version
  ansible.builtin.assert:
    that: (user_goenv.stdout | trim) == ('goenv ' ~ goenv_version)
    fail_msg: "Verified goenv binary does not report the pinned goenv version."
  when: configure_go | bool

- name: Check the configured Go runtime
  become: "{{ profile_use_become }}"
  become_user: "{{ profile_target_user }}"
  ansible.builtin.command:
    argv:
      - "{{ profile_target_home }}/.local/share/devops-toolkit/goenv/versions/{{ go_version }}/bin/go"
      - version
  register: user_go
  changed_when: false
  failed_when: false
  when: configure_go | bool

- name: Check the goenv global version
  become: "{{ profile_use_become }}"
  become_user: "{{ profile_target_user }}"
  ansible.builtin.shell: >-
    test "$(cat {{ (profile_target_home + '/.local/share/devops-toolkit/goenv/version') | quote }} 2>/dev/null)"
    = {{ go_version | quote }}
  args:
    executable: /bin/sh
  register: user_go_global
  changed_when: false
  failed_when: false
  when: configure_go | bool

- name: Install and select the configured Go version
  become: "{{ profile_use_become }}"
  become_user: "{{ profile_target_user }}"
  ansible.builtin.shell: |
    export GOENV_ROOT={{ (profile_target_home + '/.local/share/devops-toolkit/goenv') | quote }}
    export PATH={{ (profile_target_home + '/.local/share/devops-toolkit/goenv-bin') | quote }}:"$PATH"
    goenv install {{ go_version | quote }} --yes
    goenv global {{ go_version | quote }} --yes
  args:
    executable: /bin/bash
  environment:
    HOME: "{{ profile_target_home }}"
  when:
    - configure_go | bool
    - >-
      user_go.rc != 0 or
      ('go version go' ~ go_version ~ ' ') not in (user_go.stdout | default('')) or
      user_go_global.rc != 0
