---
- name: Inspect an existing DevOpsToolkit OpenSSH drop-in
  become: true
  ansible.builtin.slurp:
    path: /etc/ssh/sshd_config.d/99-devops-toolkit.conf
  register: ssh_existing_managed_dropin
  failed_when: false

- name: Resolve the effective managed authentication hardening
  ansible.builtin.set_fact:
    ssh_effective_disable_root_login: >-
      {{
        (disable_root_login | bool)
        if (ssh_apply_requested_hardening | bool)
        else ('PermitRootLogin no' in
          ((ssh_existing_managed_dropin.content | default('') | b64decode)
           if not (ssh_existing_managed_dropin.failed | default(true)) else ''))
      }}
    ssh_effective_disable_password_auth: >-
      {{
        (disable_password_auth | bool)
        if (ssh_apply_requested_hardening | bool)
        else ('PasswordAuthentication no' in
          ((ssh_existing_managed_dropin.content | default('') | b64decode)
           if not (ssh_existing_managed_dropin.failed | default(true)) else ''))
      }}

- name: Ensure the OpenSSH drop-in directory is included
  become: true
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^Include\s+/etc/ssh/sshd_config\.d/\*\.conf$'
    line: 'Include /etc/ssh/sshd_config.d/*.conf'
    insertbefore: BOF
    backup: true
  notify: Validate and restart SSH

- name: Ensure the OpenSSH drop-in directory exists
  become: true
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the managed OpenSSH drop-in
  become: true
  ansible.builtin.template:
    src: 99-devops-toolkit.conf.j2
    dest: /etc/ssh/sshd_config.d/99-devops-toolkit.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Validate and restart SSH

# 只读查询，且需容忍单元不存在（failed_when: false），systemd 模块在缺单元时会报错，
# 因此这里刻意用 command 探测 socket 激活状态。
- name: Detect whether OpenSSH is socket-activated  # noqa: command-instead-of-module
  become: true
  ansible.builtin.command: systemctl is-active ssh.socket
  register: ssh_socket_state
  changed_when: false
  failed_when: false

- name: Record whether the SSH listener is owned by ssh.socket
  ansible.builtin.set_fact:
    ssh_socket_active: "{{ (ssh_socket_state.stdout | trim) == 'active' }}"

- name: Probe IPv6 wildcard bind capability
  become: true
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - 'import socket; s = socket.socket(socket.AF_INET6, socket.SOCK_STREAM); s.bind(("::", 0)); print("ok")'
  register: ssh_ipv6_bind_probe
  changed_when: false
  failed_when: false
  when: ssh_socket_active | bool

- name: Record whether IPv6 is available for the socket listener
  ansible.builtin.set_fact:
    ssh_ipv6_available: >-
      {{
        (ssh_ipv6_bind_probe.rc | default(1) | int) == 0
        and (ssh_ipv6_bind_probe.stdout | default('') | trim) == 'ok'
      }}
  when: ssh_socket_active | bool

- name: Ensure the ssh.socket override directory exists
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system/ssh.socket.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: ssh_socket_active | bool

- name: Bind the socket-activated SSH listener to the managed ports
  become: true
  ansible.builtin.template:
    src: ssh.socket-override.conf.j2
    # 名字必须晚于 openssh sshd-socket-generator 生成的
    # /run/systemd/generator/ssh.socket.d/addresses.conf（按文件名 ASCII 排序），
    # 否则 generator 会重新清空 ListenStream 并依据 sshd_config 的 Port 生成
    # v4+v6，覆盖我们在 IPv6 不可用时的 v4-only 回退，导致 SSH 重启失败。
    dest: /etc/systemd/system/ssh.socket.d/zz-devops-toolkit.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  when: ssh_socket_active | bool
  notify: Validate and restart SSH

- name: Stat the legacy managed socket drop-in
  become: true
  ansible.builtin.stat:
    path: /etc/systemd/system/ssh.socket.d/99-devops-toolkit.conf
  register: ssh_legacy_socket_dropin_stat
  when: ssh_socket_active | bool

- name: Read the legacy managed socket drop-in
  become: true
  ansible.builtin.slurp:
    path: /etc/systemd/system/ssh.socket.d/99-devops-toolkit.conf
  register: ssh_legacy_socket_dropin
  when:
    - ssh_socket_active | bool
    - ssh_legacy_socket_dropin_stat.stat.exists | default(false) | bool

- name: Determine whether the legacy drop-in is managed by this tool
  ansible.builtin.set_fact:
    ssh_legacy_socket_dropin_is_managed: >-
      {{ ssh_legacy_socket_dropin.content | default('') | ssh_security_is_managed_socket_dropin }}
  when:
    - ssh_socket_active | bool
    - ssh_legacy_socket_dropin_stat.stat.exists | default(false) | bool

- name: Retire the legacy managed socket drop-in
  when:
    - ssh_socket_active | bool
    - ssh_legacy_socket_dropin_stat.stat.exists | default(false) | bool
    - ssh_legacy_socket_dropin_is_managed | default(false) | bool
  block:
    - name: Back up the legacy managed socket drop-in
      become: true
      ansible.builtin.copy:
        src: /etc/systemd/system/ssh.socket.d/99-devops-toolkit.conf
        dest: /etc/systemd/system/ssh.socket.d/99-devops-toolkit.conf.disabled
        remote_src: true
        owner: root
        group: root
        mode: "0644"
        backup: true
      notify: Validate and restart SSH

    - name: Remove the legacy managed socket drop-in
      become: true
      ansible.builtin.file:
        path: /etc/systemd/system/ssh.socket.d/99-devops-toolkit.conf
        state: absent
      notify: Validate and restart SSH

- name: Reload systemd to load the updated socket drop-ins
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true
  changed_when: false
  when: ssh_socket_active | bool

- name: Read the effective socket listeners after applying overrides
  become: true
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - ssh.socket
      - --property=Listen
      - --value
  register: ssh_effective_socket_listen
  changed_when: false
  failed_when: false
  when: ssh_socket_active | bool

- name: Verify the effective listeners match the intended address families
  ansible.builtin.assert:
    that:
      - (ssh_effective_socket_listen.rc | default(1) | int) == 0
      - >-
        ssh_listener_ports
        | ssh_security_listen_matches(
            ssh_ipv6_available | default(false) | bool,
            ssh_effective_socket_listen.stdout | default('')
          )
    fail_msg: >-
      The effective ssh.socket Listen endpoints do not match the intended
      address families. A vendor or generator drop-in may still be overriding
      the managed listeners (e.g. residual IPv6 on an IPv6-disabled host).
  when: ssh_socket_active | bool

- name: Validate the complete OpenSSH configuration before handlers run
  become: true
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false

- name: Apply validated SSH changes now
  ansible.builtin.meta: flush_handlers
