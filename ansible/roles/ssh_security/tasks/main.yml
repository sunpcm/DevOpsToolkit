---
- name: Record the trusted SSH connection port
  ansible.builtin.set_fact:
    ssh_transition_connection_port: >-
      {{ ansible_port | default(22) | int }}

- name: Detect whether OpenSSH is currently socket-activated  # noqa: command-instead-of-module
  become: true
  ansible.builtin.command: systemctl is-active ssh.socket
  register: ssh_prepare_socket_state
  changed_when: false
  failed_when: false
  when: (ssh_transition_connection_port | int) != (ssh_port | int)

- name: Inspect the effective ssh.socket listeners before accepting them
  become: true
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - ssh.socket
      - --property=Listen
      - --value
  register: ssh_prepare_socket_listenstream
  changed_when: false
  failed_when: false
  when:
    - (ssh_transition_connection_port | int) != (ssh_port | int)
    - (ssh_prepare_socket_state.stdout | default('') | trim) == 'active'

- name: Inspect the desired SSH port before changing listeners
  become: true
  ansible.builtin.command:
    argv:
      - ss
      - --tcp
      - --listening
      - --numeric
      - --processes
      - --no-header
      - "sport = :{{ ssh_port }}"
  register: ssh_desired_port_listener
  changed_when: false
  when: (ssh_transition_connection_port | int) != (ssh_port | int)

- name: Resolve listening process executables for the desired SSH port
  become: true
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import os, re, subprocess, sys
        port = sys.argv[1]
        out = subprocess.check_output(
            ["ss", "-ltnp", "--no-header", "sport = :" + port], text=True
        )
        pids = sorted({p for line in out.splitlines() for p in re.findall(r"pid=(\d+)", line)})
        for pid in pids:
            try:
                exe = os.readlink("/proc/" + pid + "/exe")
            except OSError:
                exe = ""
            print(pid + "=" + exe)
      - "{{ ssh_port }}"
  register: ssh_listener_exe_probe
  changed_when: false
  failed_when: false
  when: (ssh_transition_connection_port | int) != (ssh_port | int)

- name: Refuse a desired SSH port owned by another service
  ansible.builtin.assert:
    that:
      - >-
        (ssh_desired_port_listener.stdout | default(''))
        | ssh_security_port_is_free_or_owned(
            ssh_port,
            ssh_prepare_socket_state.stdout | default(''),
            ssh_prepare_socket_listenstream.stdout | default(''),
            ssh_listener_exe_probe.stdout | default('')
          )
    fail_msg: >-
      Refusing to move SSH to occupied port {{ ssh_port }}. The trusted port
      {{ ssh_transition_connection_port }} and current login remain unchanged.
  when: (ssh_transition_connection_port | int) != (ssh_port | int)

- name: Prepare SSH with both trusted and desired listener ports
  ansible.builtin.include_tasks: configure.yml
  vars:
    ssh_listener_ports: >-
      {{
        [
          ansible_port | default(22) | int,
          ssh_port | default(22) | int
        ] | unique | list
      }}
    ssh_apply_requested_hardening: false

- name: Report the safe SSH transition boundary
  ansible.builtin.debug:
    msg: >-
      SSH prepare phase complete. Trusted port {{ ssh_transition_connection_port }}
      remains available. Verify a brand-new {{ target_user }} connection on port
      {{ ssh_port }}, then run ubuntu-ssh-finalize from that connection to close
      the old port and apply authentication hardening.
