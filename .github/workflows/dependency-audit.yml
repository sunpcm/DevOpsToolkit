---
name: Dependency audit

on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Generate read-only dependency report
        run: |
          python3 scripts/dependency-audit.py --output dependency-audit.md
          cat dependency-audit.md >>"${GITHUB_STEP_SUMMARY}"

      - name: Upload report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-audit-${{ github.run_id }}
          path: dependency-audit.md
          if-no-files-found: error
          retention-days: 90
