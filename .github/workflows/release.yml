---
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    # Reuse the exact Validate quality + Ansible matrix at this tag's SHA.
    # A separate push-triggered Validate run is not a release gate.
    uses: ./.github/workflows/env-check.yml
    permissions:
      contents: read

  validate:
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout tag
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Verify release source is on main
        run: |
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "${GITHUB_SHA}" refs/remotes/origin/main

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install ansible-core==2.21.4
          mkdir -p \
            "${RUNNER_TEMP}/release-inputs/artifacts" \
            "${RUNNER_TEMP}/release-inputs/collections"
          python scripts/verify-collection-lock.py \
            --lock ansible/collections.lock.json \
            --requirements ansible/requirements.yml
          ansible-galaxy collection download \
            --requirements-file ansible/requirements.yml \
            --download-path "${RUNNER_TEMP}/release-inputs/artifacts" \
            --no-deps
          python scripts/verify-collection-lock.py \
            --lock ansible/collections.lock.json \
            --requirements ansible/requirements.yml \
            --artifacts "${RUNNER_TEMP}/release-inputs/artifacts"
          ansible-galaxy collection install \
            "${RUNNER_TEMP}"/release-inputs/artifacts/*.tar.gz \
            --collections-path "${RUNNER_TEMP}/release-inputs/collections"
          python scripts/verify-collection-lock.py \
            --lock ansible/collections.lock.json \
            --installed "${RUNNER_TEMP}/release-inputs/collections"
          echo "ANSIBLE_COLLECTIONS_PATH=${RUNNER_TEMP}/release-inputs/collections" >>"${GITHUB_ENV}"
          echo "ANSIBLE_COLLECTIONS_PATHS=${RUNNER_TEMP}/release-inputs/collections" >>"${GITHUB_ENV}"

      - name: Validate source
        run: ./tests/verify-ansible.sh

      - name: Preserve validated collections for packaging
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-collections-${{ github.sha }}
          path: ${{ runner.temp }}/release-inputs
          if-no-files-found: error
          retention-days: 1

      - name: Show manual VM approval checklist
        run: |
          {
            echo "## 发布审批前必须人工核对"
            echo "- 来源 SHA：\`${GITHUB_SHA}\`；tag：\`${GITHUB_REF_NAME}\`。"
            echo "- 核对这次发布的隔离 VM 报告原件及 SHA256，不接受历史报告或口头确认。"
            echo "- 报告须在 8 天内、同 SHA、22.04/24.04、故障测试和清理均通过。"
            echo "- 缺少证据或不一致时，拒绝 release Environment 审批。"
          } >>"${GITHUB_STEP_SUMMARY}"

  release:
    needs: validate
    runs-on: ubuntu-24.04
    # The protected environment is the mandatory human gate after same-SHA CI.
    # Reviewers must check the one-time VM report before approving this job.
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      COSIGN_VERSION: v3.1.1
      COSIGN_LINUX_AMD64_SHA256: ae1ecd212663f3693ad9edf8b1a183900c9a52d3155ba6e354237f9a0f6463fc
    steps:
      - name: Checkout validated tag on a fresh runner
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Confirm clean source
        run: |
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Restore validated collections
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-collections-${{ github.sha }}
          path: ${{ runner.temp }}/release-inputs

      - name: Build fixed-name assets
        env:
          DEVOPS_TOOLKIT_COLLECTIONS_SOURCE: ${{ runner.temp }}/release-inputs/collections
          DEVOPS_TOOLKIT_COLLECTION_ARTIFACTS: ${{ runner.temp }}/release-inputs/artifacts
        run: ./scripts/build-release.sh "${GITHUB_REF_NAME}" dist

      - name: Install pinned Cosign
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "${RUNNER_TEMP}/cosign"
          gh release download "${COSIGN_VERSION}" \
            --repo sigstore/cosign \
            --pattern cosign-linux-amd64 \
            --dir "${RUNNER_TEMP}/cosign"
          echo "${COSIGN_LINUX_AMD64_SHA256}  ${RUNNER_TEMP}/cosign/cosign-linux-amd64" | sha256sum --check --strict
          chmod 0755 "${RUNNER_TEMP}/cosign/cosign-linux-amd64"
          echo "${RUNNER_TEMP}/cosign" >>"${GITHUB_PATH}"
          mv "${RUNNER_TEMP}/cosign/cosign-linux-amd64" "${RUNNER_TEMP}/cosign/cosign"

      - name: Sign archive with GitHub OIDC
        run: |
          cosign sign-blob \
            --yes \
            --bundle dist/devops-toolkit.tar.gz.sigstore.json \
            dist/devops-toolkit.tar.gz

      - name: Verify Sigstore identity
        run: |
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          cosign verify-blob \
            --bundle dist/devops-toolkit.tar.gz.sigstore.json \
            --certificate-identity "${identity}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-repository "${GITHUB_REPOSITORY}" \
            --certificate-github-workflow-ref "${GITHUB_REF}" \
            --certificate-github-workflow-trigger push \
            dist/devops-toolkit.tar.gz

      - name: Verify packaged version
        run: |
          mkdir packaged
          tar -xzf dist/devops-toolkit.tar.gz -C packaged
          test "$(cat packaged/devops-toolkit/VERSION)" = "${GITHUB_REF_NAME}"
          (cd dist && sha256sum --check devops-toolkit.tar.gz.sha256)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/devops-toolkit.tar.gz \
            dist/devops-toolkit.tar.gz.sha256 \
            dist/devops-toolkit.tar.gz.sigstore.json \
            --verify-tag \
            --generate-notes \
            --notes "Source commit: ${GITHUB_SHA}" \
            --title "${GITHUB_REF_NAME}"
