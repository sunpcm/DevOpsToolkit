---
name: Validate

on:
  workflow_call:
  # quality 作业会扫描整个仓库（全部 *.sh、yamllint .），因此不做 push 路径过滤，
  # 否则 AcmeConfig/wsl-dev/ubuntu-server 等目录的 shell/yaml 问题会漏过 CI。
  push:
    branches:
      - "**"
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full history
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Build shared pinned verification environment
        run: ./scripts/verify-dev.sh --bootstrap --python python3

      - name: Run unified static verification
        run: ./scripts/verify-dev.sh

  validate:
    runs-on: ubuntu-24.04
    env:
      DEVOPS_TOOLKIT_EXPECT_ANSIBLE_CORE: ${{ matrix.ansible_core }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.12"
            ansible_core: "2.21.4"
          - python: "3.14"
            ansible_core: "2.21.4"
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Build shared pinned validation environment
        run: ./scripts/verify-dev.sh --bootstrap --ansible-only --python python3

      - name: Validate Ansible on Python ${{ matrix.python }}
        run: ./scripts/verify-dev.sh --ansible-only
